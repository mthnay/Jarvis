services:
  - type: web
    name: jarvis-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: models/gemini-2.5-flash-native-audio-latest
      - key: JARVIS_VOICE
        value: Charon
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_HANDLE
        sync: false
