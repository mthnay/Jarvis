<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020c0c">
<title>J.A.R.V.I.S</title>
<link rel="preload" href="/fonts/Grift-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/Grift-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Same layout as the desktop HUD (ui.py): one canvas for everything drawn,
     HTML widgets placed on top at the desktop's coordinates. -->
<canvas id="hud" aria-hidden="true"></canvas>

<button id="settings-btn" class="hud-widget bracket" type="button" aria-expanded="false" aria-controls="settings-panel">
  <span class="settings-title">SYSTEM SETTINGS</span>
  <span class="settings-badge">VOICE CORE · WEB</span>
  <span class="settings-arrow">▸</span>
</button>

<section id="settings-panel" class="hud-widget" hidden aria-label="Ayarlar">
  <h2>SETTINGS</h2>
  <div class="tabs" role="tablist">
    <button id="tab-settings" class="tab bracket active" type="button" role="tab" aria-selected="true">SETTINGS</button>
    <button id="tab-debug" class="tab bracket" type="button" role="tab" aria-selected="false">DEBUG</button>
  </div>
  <div id="settings-body" class="settings-body">
    <button id="api-btn" class="bracket" type="button">⌘ API SETTINGS</button>
    <button id="sfx-btn" class="bracket" type="button">♪ SFX ON</button>
    <p id="status-primary" class="status-primary">Gemini kontrol ediliyor</p>
    <p id="status-secondary" class="status-secondary">Kanal: --</p>
    <span class="label sfx-label">SFX</span>
    <label for="fx-level" id="fx-label" class="fx-label">FX LEVEL  20%</label>
    <input id="fx-level" type="range" min="0" max="100" value="20">
    <label for="voice" class="label voice-label">VOICE</label>
    <select id="voice"></select>
  </div>
  <div id="debug-body" class="debug-body" hidden></div>
</section>

<button id="mute" class="hud-widget bracket ctrl" type="button">🎙 LIVE</button>
<button id="pause" class="hud-widget bracket ctrl" type="button">⏸ PAUSE</button>
<button id="shutdown" class="hud-widget bracket ctrl" type="button">⏻  SHUTDOWN</button>

<div id="log" class="hud-widget" role="log" aria-live="polite" aria-label="Konuşma geçmişi"></div>
<form id="composer" class="hud-widget">
  <input id="message" autocomplete="off" aria-label="Komut" maxlength="8000">
  <button id="send" type="submit">SEND ▸</button>
</form>

<script src="/static/app.js"></script>
</body>
</html>
